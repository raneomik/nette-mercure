on:
  pull_request:
  push:

permissions:
  contents: read
  actions: read
  checks: write

env:
  tools: "composer:v2"
  cache-version: "1"

jobs:
  php-workflow:
    name: "CI - PHP 8.5"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: 8.5"
          extensions: "pcov"
          tools: "${{ env.tools }}"

      - name: "Setup problem matchers for PHP"
        run: 'echo "::add-matcher::${{ runner.tool_cache }}/php.json"'

      - name: "Get Composer cache directory"
        id: "composercache"
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Cache PHP dependencies"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.composercache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-composer-"

      - name: "Install dependencies"
        run: "composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader"

      - name: "Run Rector"
        run: "composer rector -- --output-format=github --no-progress-bar"
      - name: "Run PHPStan"
        run: "composer phpstan -- --error-format=github --no-progress"
      - name: "Run ECS"
        run: "composer ecs -- --no-progress-bar"

      - name: "Run Tests with coverage"
        run: "composer test-coverage"

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: TESTER Tests
          path: tests/reports/junit.xml
          reporter: tester-junit

      - name: Check test coverage
        uses: johanvanhelden/gha-clover-test-coverage-check@v1
        id: coverage
        with:
          percentage: "30"
          filename: "tests/reports/coverage.xml"

      - name: Generate the badge SVG image
        uses: emibcn/badge-action@v1
        id: badge
        with:
          label: "Coverage"
          status: ${{ steps.coverage.outputs.coverage }}
          path: ./badges/test-coverage.svg
          color: ${{
            steps.coverage.outputs.coverage > 90 && 'green'         ||
            steps.coverage.outputs.coverage > 80 && 'yellow,green'  ||
            steps.coverage.outputs.coverage > 70 && 'yellow'        ||
            steps.coverage.outputs.coverage > 60 && 'orange,yellow' ||
            steps.coverage.outputs.coverage > 50 && 'orange'        ||
            steps.coverage.outputs.coverage > 40 && 'red,orange'    ||
            'red' }}
